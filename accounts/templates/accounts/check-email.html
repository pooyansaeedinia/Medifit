{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'media/images/favicons/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'media/images/favicons/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'media/images/favicons/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'media/images/favicons/site.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'css/check-email.css' %}">
    <title>Medifit || Check your email inbox</title>
</head>
<body>
<section class="container">
    <img src="{% static 'media/images/logo.png' %}" alt="logo" class="logo">
    <h2>Check Your Email Inbox</h2>
    <p>We've sent a confirmation email to your email address.<br>Please check your inbox and click on the link to
        activate your account.</p>
    <a href="{% url 'accounts:login_signup' %}">Back to Sign Up</a>
</section>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'media/images/favicons/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'media/images/favicons/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'media/images/favicons/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'media/images/favicons/site.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'css/forgot-password.css' %}">
    <title>Medifit || Forgot Password</title>
</head>
<body>
<section class="container">
    <div class="recovery-card">
        <img src="{% static 'media/images/medifit-logo.png' %}" alt="Medifit Logo" class="logo">
        <h2>Reset Your Password</h2>
        <p>Enter your email address and we'll send you a link to reset your password.</p>
        <form action="{% url 'accounts:password_reset' %}" method="post" id="recovery-form">
            {% csrf_token %}
            <div class="input-group">
                <input type="email" name="email" id="recovery-email" placeholder="Enter your email address"
                       aria-label="email" required autocomplete="off">
                <i class="bi bi-envelope"></i>
            </div>
            <button type="submit" class="submit-btn">Reset Password</button>
            <a href="{% url 'accounts:login_signup' %}" class="back-link">
                <i class="bi bi-arrow-left"></i>
                Back to Login
            </a>
        </form>
    </div>
</section>
<script src="{% static 'js/forgot-password.js' %}"></script>
</body>
</html>
